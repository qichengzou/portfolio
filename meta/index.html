<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <title>Meta</title>
</head>
<body>
    <p>This page contains stats of codes in this website</p>

    <div class="time-filter">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time-display"></time>
        </label>
    </div>

    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story">
            <div id="story-steps"></div>
        </div>

        <div id="scatter-plot">
            <h2>Commits by time of day</h2>

            <div id="chart"></div>

            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd>
                    <a href="" id="commit-link" target="_blank"></a>
                </dd>

                <dt>Date</dt>
                <dd id="commit-date"></dd>

                <dt>Time</dt>
                <dd id="commit-time"></dd>

                <dt>Author</dt>
                <dd id="commit-author"></dd>

                <dt>Lines Edited</dt>
                <dd id="commit-lines"></dd>
            </dl>

            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <section id="file-section">
        <h2>File size race</h2>

        <div class="time-filter">
            <label>
                Show files until:
                <input type="range" id="file-progress" min="0" max="100" value="100">
                <time id="file-time-display"></time>
            </label>
        </div>

        <dl id="files"></dl>
    </section>
</body>
</html>
