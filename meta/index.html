<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <title>Meta</title>
</head>
<body>
    <p>This page contains stats of codes in this website</p>
    <div class="time-filter">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time-display"></time>
        </label>
    </div>

    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story"></div>

        <div id="scatter-plot">
            <h2>Commits by time of day</h2>

            <div id="chart"></div>

            <dl id="commit-tooltip" class="info tooltip" hidden>
                ...
            </dl>

            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="files"></dl>
</body>
</html>
